services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: buybye
      POSTGRES_PASSWORD: buybye
      POSTGRES_DB: buybye
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      WATCHPACK_POLLING: "true"
    depends_on:
      - db

volumes:
  pgdata:
